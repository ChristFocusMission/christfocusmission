<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live supporters · Music for Every Child</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Compact live counter, made to be embedded in the Canva site (Embed app → this page's link). */
  :root{--indigo:#5B5BAA;--indigo-2:#7373C4;--sun:#FBC10A;--amber:#F7A814;--teal:#1E9AC3;--aqua:#5FC2C3;
        --ink:#23234A;--ink-2:#4B4B78;--track:#E8E8F4;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;padding:10px}
  .card{width:100%;max-width:560px;background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 14px 40px -18px rgba(91,91,170,.45);border:1px solid rgba(35,35,74,.08)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .live{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--amber)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:p 1.8s infinite}
  @keyframes p{70%{box-shadow:0 0 0 10px rgba(247,168,20,0)}0%{box-shadow:0 0 0 0 rgba(247,168,20,.6)}}
  .brand{font-weight:800;font-size:13px;color:var(--ink-2)}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px;flex-wrap:wrap}
  .count{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(40px,9vw,60px);line-height:1;font-variant-numeric:tabular-nums;transition:color .4s}
  .count.bump{color:var(--teal)}
  .of{font-weight:700;color:var(--ink-2);font-size:15px;margin-top:4px}
  .raised{text-align:right;font-weight:700;color:var(--ink-2);font-size:13px}
  .raised b{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-size:22px;color:var(--ink)}
  .bar{height:14px;background:var(--track);border-radius:999px;margin:16px 0 8px;overflow:hidden}
  .fill{height:100%;width:0;min-width:14px;border-radius:999px;background:linear-gradient(90deg,var(--aqua),var(--teal) 45%,var(--indigo));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .meta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-2)}
  .btn{display:block;text-align:center;margin-top:16px;padding:15px 20px;border-radius:999px;font:800 17px "Nunito",sans-serif;color:#fff;text-decoration:none;
       background:linear-gradient(180deg,var(--indigo-2),var(--indigo));box-shadow:0 12px 26px -12px rgba(91,91,170,.9),inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .note{text-align:center;font-size:12px;color:var(--ink-2);margin-top:8px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="card" aria-live="polite">
    <div class="top">
      <span class="live"><span class="dot"></span>LIVE</span>
      <span class="brand">Music for Every Child</span>
    </div>
    <div class="row">
      <div>
        <div class="count" id="count">0</div>
        <div class="of">of 1,00,000 supporters</div>
      </div>
      <div class="raised"><b id="raised">₹0</b>raised so far</div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="pct">0%</span><span id="left">1,00,000 to go</span></div>
    <a class="btn" id="cta" href="https://www.christfocusmission.org/kingdavid/support/" target="_blank" rel="noopener">Become a supporter · ₹1,000+</a>
    <div class="note">🔒 Secure payment by Razorpay · opens in a new tab</div>
  </div>
<script>
  const API_BASE = "https://kdv-supporters.christfocusmission.workers.dev";
  const GOAL = 100000, POLL_MS = 8000;
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString("en-IN");
  let shown = { s: 0, a: 0 }, first = true;
  function anim(el, from, to, prefix) {
    if (from === to) { el.textContent = prefix + fmt(to); return; }
    const t0 = performance.now(), ms = first ? 1400 : 900;
    const step = (t) => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      el.textContent = prefix + fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  async function poll() {
    try {
      const d = await (await fetch(API_BASE + "/api/stats", { cache: "no-store" })).json();
      if (typeof d.supporters !== "number") return;
      anim($("count"), shown.s, d.supporters, "");
      anim($("raised"), shown.a, d.amount_inr, "₹");
      if (!first && d.supporters > shown.s) { $("count").classList.add("bump"); setTimeout(() => $("count").classList.remove("bump"), 1200); }
      const pct = Math.min(100, (d.supporters / GOAL) * 100);
      $("fill").style.width = pct + "%";
      $("pct").textContent = pct > 0 && pct < 0.01 ? "<0.01%" : (pct < 1 ? pct.toFixed(2) : pct.toFixed(1)) + "%";
      $("left").textContent = d.supporters >= GOAL ? "Goal reached! 🎉" : fmt(GOAL - d.supporters) + " to go";
      shown = { s: d.supporters, a: d.amount_inr }; first = false;
    } catch (e) { /* try again next round */ }
  }
  poll(); setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
</script>
</body>
</html>
